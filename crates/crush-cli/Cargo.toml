[package]
name = "crush-cli"
version = "3.0.0"
edition = "2021"
description = "CRUSH v3.0 — Multimedia Mission Control TUI"

[[bin]]
name = "crush"
path = "src/main.rs"

[dependencies]
crush-core = { path = "../crush-core" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
dirs = "5"
