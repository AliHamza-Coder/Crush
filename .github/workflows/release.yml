name: Release

# Triggers ONLY on tag push (created by version-gate.yml) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Build on each platform ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: crush-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: crush-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/crush-cli -> target'

      - name: Lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      # ── Windows: create zip with exe + README ──
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${GITHUB_REF_NAME#v}"
          $dir = "crush-$version-windows-x64"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item "target/release/crush.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          Copy-Item "LICENSE" "$dir/" -ErrorAction SilentlyContinue
          @"
          # CRUSH v$version

          ## Install
          1. Extract this folder
          2. Add to PATH or run `crush.exe` directly

          ## Usage
          ``````
          crush analyse .
          crush -i ./images -f webp -q 85
          crush -i ./videos -f mp4
          ``````
          "@ | Set-Content "$dir/INSTALL.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          echo "ZIP=$dir.zip" >> $env:GITHUB_ENV

      # ── Linux: create tar.gz + deb ──
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="crush-${VERSION}-linux-x64"
          mkdir -p "$DIR"
          cp target/release/crush "$DIR/"
          cp README.md "$DIR/"
          cp LICENSE "$DIR/" 2>/dev/null || true
          cat > "$DIR/INSTALL.txt" << 'INSTALL'
          # CRUSH - Install

          ## Quick install
          sudo cp crush /usr/local/bin/

          ## Or run directly
          ./crush analyse .
          INSTALL
          tar -czf "$DIR.tar.gz" "$DIR"
          echo "TARBALL=$DIR.tar.gz" >> "$GITHUB_ENV"

          # Build .deb package
          DEB_DIR="crush_${VERSION}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/local/bin"
          cp target/release/crush "$DEB_DIR/usr/local/bin/"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: crush
          Version: $VERSION
          Architecture: amd64
          Description: CRUSH - Multimedia Mission Control
          A fast image, video, and audio compressor/convertor written in Rust.
          EOF
          dpkg-deb --build "$DEB_DIR" "crush_${VERSION}_amd64.deb"
          echo "DEB=crush_${VERSION}_amd64.deb" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.ZIP }}
            ${{ env.TARBALL }}
            ${{ env.DEB }}
          retention-days: 1

  # ── Create release ──
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse release checklist
        id: checklist
        run: |
          python .github/scripts/parse_checklist.py --expect-version "${GITHUB_REF_NAME#v}" --write-body RELEASE_BODY.txt

      - name: Load release body
        id: body
        run: |
          {
            echo 'content<<EOF'
            cat RELEASE_BODY.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CRUSH ${{ github.ref_name }}
          body: ${{ steps.body.outputs.content }}
          draft: false
          prerelease: false
          files: artifacts/*
