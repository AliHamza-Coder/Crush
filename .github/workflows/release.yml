name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/crush-cli -> target'

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $version = "${GITHUB_REF_NAME#v}"
          $dir = "crush-$version-windows-x64"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item "target/release/crush.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          @"
          CRUSH v$version - Windows x64
          
          Install:
          1. Extract this folder
          2. Add to PATH or run crush.exe directly
          
          Usage:
          crush.exe analyse .
          crush.exe -i ./images -f webp -q 85
          "@ | Set-Content "$dir/INSTALL.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: crush-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/crush-cli -> target'

      - name: Build
        run: cargo build --release --workspace

      - name: Package tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="crush-${VERSION}-linux-x64"
          mkdir -p "$DIR"
          cp target/release/crush "$DIR/"
          cp README.md "$DIR/"
          cat > "$DIR/INSTALL.txt" << 'EOF'
          CRUSH - Linux x64
          
          Install:
          sudo cp crush /usr/local/bin/
          
          Usage:
          crush analyse .
          crush -i ./images -f webp -q 85
          EOF
          tar -czf "$DIR.tar.gz" "$DIR"

      - name: Package deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="crush_${VERSION}_amd64"
          mkdir -p "$DEB/DEBIAN"
          mkdir -p "$DEB/usr/local/bin"
          cp target/release/crush "$DEB/usr/local/bin/"
          cat > "$DEB/DEBIAN/control" << EOF
          Package: crush
          Version: $VERSION
          Architecture: amd64
          Description: CRUSH - Multimedia Mission Control
          EOF
          dpkg-deb --build "$DEB" "crush_${VERSION}_amd64.deb"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            crush-*-linux-x64.tar.gz
            crush_*.deb

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python .github/scripts/parse_checklist.py --expect-version "$VERSION" --write-body RELEASE_BODY.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CRUSH ${{ github.ref_name }}
          body_path: RELEASE_BODY.txt
          draft: false
          prerelease: false
          files: artifacts/*
