name: Version Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract current version
        id: current
        run: |
          VERSION=$(python .github/scripts/extract_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest released version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          RESULT=$(python .github/scripts/semver_compare.py "${{ steps.current.outputs.version }}" "${{ steps.latest.outputs.version }}")
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.compare.outputs.result == 'gt'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "TAGGED=v$VERSION" >> "$GITHUB_OUTPUT"
